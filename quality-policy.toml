[python]
max_loop_depth = 1

[files]
ignored_directories = [".git", ".venv", ".mypy_cache", ".pytest_cache", ".ruff_cache", "__pycache__", "htmlcov", ".terraform", ".tools", ".codegraph", ".local", ".local-runtime", ".clawpatch", "node_modules"]
allowed_suffixes = [".py", ".toml", ".lock", ".md", ".yml", ".yaml", ".json", ".tf", ".tfvars", ".hcl", ".sh", ".sql", ".ini", ".txt", ".Dockerfile"]
allowed_names = ["Dockerfile", "Makefile", ".gitignore", ".dockerignore", ".sqlfluffignore", ".python-version", ".coverage", "LICENSE"]

[architecture]
package = "podium_forecasting"
layers = ["domain", "ports", "application", "adapters", "entrypoints"]

[architecture.allowed]
domain = ["domain"]
ports = ["domain", "ports"]
application = ["domain", "ports", "application"]
adapters = ["domain", "ports", "adapters"]
entrypoints = ["domain", "ports", "application", "adapters", "entrypoints"]

[architecture.effects]
restricted_layers = ["domain", "ports", "application"]
forbidden_references = ["os.environ"]
forbidden_calls = [
  "builtins.input",
  "builtins.open",
  "builtins.print",
  "os.getenv",
  "os.makedirs",
  "os.mkdir",
  "os.putenv",
  "os.remove",
  "os.removedirs",
  "os.rename",
  "os.replace",
  "os.rmdir",
  "os.unlink",
  "os.unsetenv",
  "pathlib.Path.chmod",
  "pathlib.Path.hardlink_to",
  "pathlib.Path.mkdir",
  "pathlib.Path.open",
  "pathlib.Path.read_bytes",
  "pathlib.Path.read_text",
  "pathlib.Path.rename",
  "pathlib.Path.replace",
  "pathlib.Path.rmdir",
  "pathlib.Path.symlink_to",
  "pathlib.Path.touch",
  "pathlib.Path.unlink",
  "pathlib.Path.write_bytes",
  "pathlib.Path.write_text",
  "socket.create_connection",
  "socket.socket",
  "subprocess.Popen",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output",
  "subprocess.run",
  "urllib.request.urlopen",
]

[files.locations]
".sh" = ["scripts"]
"Dockerfile" = ["containers"]
".Dockerfile" = ["containers"]
".tf" = ["infra/terraform/modules/storage"]
".tfvars" = ["infra/terraform/modules/storage/tests/security.tfvars"]
".hcl" = [".tflint.hcl", "infra/terraform/modules/storage/.terraform.lock.hcl", "infra/terraform/modules/storage/tests/*.tftest.hcl"]

[guidance]
max_skill_words = 1000
max_skill_lines = 100
max_agent_words = 600
